<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Book</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-gray-100 min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white py-5 shadow">
    <div class="container mx-auto text-center">
      <h1 class="text-2xl font-bold">📘 Address Book</h1>
      <p class="text-sm opacity-90">Kelola kontak dengan mudah & rapi</p>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 container mx-auto p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

      <!-- FORM -->
      <section class="bg-white rounded-2xl shadow-lg p-6">
        <h2 class="text-xl font-semibold mb-5 text-gray-700">
          ➕ Tambah Kontak
        </h2>

        <form id="contactForm" class="space-y-4">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-600">
              Nama
            </label>
            <input
              type="text"
              id="name"
              placeholder="Masukkan nama"
              class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none"
            />
          </div>

          <div>
            <label for="phone" class="block text-sm font-medium text-gray-600">
              No. Telepon
            </label>
            <input
              type="text"
              id="phone"
              placeholder="Masukkan nomor telepon"
              class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none"
            />
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-600">
              Email
            </label>
            <input
              type="email"
              id="email"
              placeholder="Masukkan email"
              class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none"
            />
          </div>

          <div>
            <label for="location" class="block text-sm font-medium text-gray-600">
              Lokasi
            </label>
            <input
              type="text"
              id="location"
              placeholder="Masukkan lokasi"
              class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
            Simpan Kontak
          </button>
        </form>
      </section>

      <!-- LIST -->
      <section>
        <h2 class="text-xl font-semibold mb-5 text-gray-700">
          📒 Daftar Kontak
        </h2>

        <div id="contactList" class="space-y-4">
          <p class="text-gray-500 italic">
            Belum ada data kontak.
          </p>
        </div>
      </section>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-200 text-center py-3 text-sm text-gray-600">
    © Alfa Rizki 2025 Address Book App
  </footer>

  <!-- SCRIPT -->
  <script src="assets/scripts/script.js"></script>
</body>
</html>
