<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Book</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-indigo-600 dark:bg-indigo-700 text-white p-6 shadow">
    <div class="flex items-center justify-between max-w-6xl mx-auto">
      <div class="flex items-center gap-3">
        <img src="assets/images/LOGOUMHT.png" class="w-12 rounded-full">
        <div>
          <h1 class="text-xl font-bold">Address Book</h1>
          <p class="text-xs opacity-90">Manajemen Kontak</p>
        </div>
      </div>

      <button
        id="darkToggle"
        class="bg-white/20 px-3 py-1 rounded text-sm hover:bg-white/30"
      >
        🌙 Dark
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 max-w-6xl mx-auto p-6">
    <section class="grid grid-cols-1 md:grid-cols-2 gap-8">

      <!-- FORM -->
      <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
        <h2 id="formTitle" class="text-lg font-semibold mb-4 text-center">
          Tambah Kontak
        </h2>

        <form id="contactForm" class="space-y-4">
          <input type="hidden" id="editIndex">

          <input id="name" type="text" placeholder="Nama"
            class="w-full p-2 rounded border dark:border-gray-700 dark:bg-gray-700" />

          <input id="phone" type="tel" placeholder="No. Telepon"
            class="w-full p-2 rounded border dark:border-gray-700 dark:bg-gray-700" />

          <input id="email" type="email" placeholder="Email"
            class="w-full p-2 rounded border dark:border-gray-700 dark:bg-gray-700" />

          <input id="location" type="text" placeholder="Alamat"
            class="w-full p-2 rounded border dark:border-gray-700 dark:bg-gray-700" />

          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded"
          >
            Simpan
          </button>
        </form>
      </div>

      <!-- LIST -->
      <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
        <h2 class="text-lg font-semibold mb-3 text-center">
          Daftar Kontak
        </h2>

        <!-- SEARCH -->
        <input
          id="searchInput"
          type="text"
          placeholder="Cari nama / email / nomor..."
          class="w-full mb-4 p-2 rounded border dark:border-gray-700 dark:bg-gray-700"
        />

        <ul id="contactList" class="space-y-3"></ul>
      </div>

    </section>
  </main>

  <footer class="text-center text-sm p-4 bg-gray-200 dark:bg-gray-800">
    © 2025 Address Book by Alfa Rizki. All rights reserved.
  </footer>

  <script src="assets/scripts/script.js"></script>
</body>
</html>
