<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Book</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white py-4 text-center">
    <h1 class="text-2xl font-bold">Address Book</h1>
    <p class="text-sm">Aplikasi Buku Alamat Sederhana</p>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 container mx-auto p-4">

    <!-- FORM SECTION -->
    <section class="bg-white p-4 rounded shadow mb-6">
      <h2 class="text-lg font-semibold mb-3">Tambah Kontak</h2>

      <form id="contactForm" class="space-y-3">
        <div>
          <label for="name" class="block text-sm font-medium">Nama</label>
          <input
            type="text"
            id="name"
            class="w-full border rounded px-3 py-2"
            placeholder="Masukkan nama"
          />
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium">No. Telepon</label>
          <input
            type="text"
            id="phone"
            class="w-full border rounded px-3 py-2"
            placeholder="Masukkan nomor telepon"
          />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium">Email</label>
          <input
            type="email"
            id="email"
            class="w-full border rounded px-3 py-2"
            placeholder="Masukkan email"
          />
        </div>

        <div>
          <label for="location" class="block text-sm font-medium">Lokasi</label>
          <input
            type="text"
            id="location"
            class="w-full border rounded px-3 py-2"
            placeholder="Masukkan lokasi"
          />
        </div>

        <button
          type="submit"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Simpan Kontak
        </button>
      </form>
    </section>

    <!-- LIST SECTION -->
    <section>
      <h2 class="text-lg font-semibold mb-3">Daftar Kontak</h2>

      <div id="contactList" class="grid gap-4">
        <!-- Data kontak muncul di sini -->
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-200 text-center text-sm py-3">
    © 2025 Alfa Rizki Address Book
  </footer>

  <!-- SCRIPT -->
  <script src="assets/scripts/script.js"></script>
</body>
</html>
